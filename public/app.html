<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oike — Sales Intelligence Platform</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.svg" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --globant-green: #5BBFB5;
      --globant-dark: #1A1A2E;
      --globant-darker: #12121F;
      --globant-card: #1E1E32;
      --globant-border: #2A2A44;
      --globant-text: #E8E8F0;
      --globant-muted: #8888A8;
      --globant-accent: #5BBFB5;
      --globant-success: #4ADE80;
      --globant-warning: #FBBF24;
      --globant-danger: #F87171;
      --globant-info: #60A5FA;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--globant-darker);
      color: var(--globant-text);
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      width: 240px; background: var(--globant-dark);
      border-right: 1px solid var(--globant-border);
      display: flex; flex-direction: column;
      z-index: 100;
    }
    .sidebar-logo {
      padding: 24px 20px;
      border-bottom: 1px solid var(--globant-border);
      display: flex; align-items: center; gap: 12px;
    }
    .sidebar-logo .logo-icon {
      width: 36px; height: 36px; background: var(--globant-green);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 16px; color: var(--globant-dark);
    }
    .sidebar-logo span { font-weight: 700; font-size: 14px; color: var(--globant-text); }
    .sidebar-logo small { display: block; font-size: 11px; color: var(--globant-muted); font-weight: 400; }

    .sidebar-nav { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      padding: 10px 12px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; font-weight: 500; color: var(--globant-muted);
      transition: all 0.15s ease;
    }
    .nav-item:hover { background: var(--globant-card); color: var(--globant-text); }
    .nav-item.active { background: rgba(91,191,181,0.12); color: var(--globant-green); }
    .nav-item .nav-icon { font-size: 18px; width: 24px; text-align: center; }

    .sidebar-footer {
      flex-shrink: 0;
      padding: 16px 20px; border-top: 1px solid var(--globant-border);
      font-size: 11px; color: var(--globant-muted);
    }

    /* Main content */
    .main { margin-left: 240px; padding: 24px 32px; min-height: 100vh; }

    /* Header */
    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .page-header p { font-size: 13px; color: var(--globant-muted); }

    /* Cards */
    .card {
      background: var(--globant-card); border: 1px solid var(--globant-border);
      border-radius: 12px; padding: 20px; margin-bottom: 16px;
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .card-header h3 { font-size: 14px; font-weight: 600; }

    /* KPI Row */
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .kpi-card {
      background: var(--globant-card); border: 1px solid var(--globant-border);
      border-radius: 12px; padding: 20px;
    }
    .kpi-card .kpi-label { font-size: 11px; color: var(--globant-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .kpi-card .kpi-value { font-size: 28px; font-weight: 800; color: var(--globant-green); }
    .kpi-card .kpi-sub { font-size: 12px; color: var(--globant-muted); margin-top: 4px; }

    /* Tables */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      text-align: left; padding: 10px 12px; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--globant-muted); border-bottom: 1px solid var(--globant-border);
    }
    .data-table td {
      padding: 12px; font-size: 13px;
      border-bottom: 1px solid var(--globant-border);
    }
    .data-table tr:hover { background: rgba(91,191,181,0.04); }

    /* Badges */
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .badge-green { background: rgba(74,222,128,0.15); color: var(--globant-success); }
    .badge-yellow { background: rgba(251,191,36,0.15); color: var(--globant-warning); }
    .badge-red { background: rgba(248,113,113,0.15); color: var(--globant-danger); }
    .badge-blue { background: rgba(96,165,250,0.15); color: var(--globant-info); }
    .badge-accent { background: rgba(91,191,181,0.15); color: var(--globant-green); }

    /* Action Buttons */
    .action-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 6px; border: none;
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: all 0.15s ease; text-decoration: none;
    }
    .btn-whatsapp { background: rgba(37,211,102,0.15); color: #25D366; }
    .btn-whatsapp:hover { background: rgba(37,211,102,0.3); }
    .btn-email { background: rgba(96,165,250,0.15); color: #60A5FA; }
    .btn-email:hover { background: rgba(96,165,250,0.3); }
    .btn-linkedin { background: rgba(10,102,194,0.15); color: #0A66C2; }
    .btn-linkedin:hover { background: rgba(10,102,194,0.3); }
    .btn-call { background: rgba(251,191,36,0.15); color: #FBBF24; }
    .btn-call:hover { background: rgba(251,191,36,0.3); }
    .btn-primary { background: var(--globant-green); color: var(--globant-dark); font-weight: 600; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-ghost { background: transparent; color: var(--globant-muted); border: 1px solid var(--globant-border); }
    .btn-ghost:hover { border-color: var(--globant-green); color: var(--globant-green); }

    /* Forms */
    .input-field {
      width: 100%; padding: 10px 14px; border-radius: 8px;
      border: 1px solid var(--globant-border); background: var(--globant-darker);
      color: var(--globant-text); font-size: 13px; font-family: 'Inter', sans-serif;
    }
    .input-field:focus { outline: none; border-color: var(--globant-green); }
    .input-field::placeholder { color: var(--globant-muted); }
    select.input-field { cursor: pointer; }
    textarea.input-field { resize: vertical; min-height: 80px; }

    /* Log entry */
    .log-entry {
      display: flex; gap: 12px; padding: 12px 0;
      border-bottom: 1px solid var(--globant-border);
    }
    .log-entry:last-child { border-bottom: none; }
    .log-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .log-content { flex: 1; }
    .log-content .log-title { font-size: 13px; font-weight: 500; }
    .log-content .log-meta { font-size: 11px; color: var(--globant-muted); margin-top: 2px; }

    /* Filters row */
    .filters-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }

    /* Account card */
    .account-card {
      background: var(--globant-card); border: 1px solid var(--globant-border);
      border-radius: 12px; padding: 20px; cursor: pointer;
      transition: all 0.15s ease; position: relative; overflow: hidden;
    }
    .account-card:hover { border-color: var(--globant-green); transform: translateY(-2px); }
    .account-card .accent-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--globant-green); }
    .account-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .account-card .account-meta { font-size: 12px; color: var(--globant-muted); }

    /* Stakeholder detail panel */
    .detail-panel {
      position: fixed; right: 0; top: 0; bottom: 0; width: 420px;
      background: var(--globant-dark); border-left: 1px solid var(--globant-border);
      z-index: 200; padding: 24px; overflow-y: auto;
      transform: translateX(100%); transition: transform 0.25s ease;
    }
    .detail-panel.open { transform: translateX(0); }
    .detail-panel-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 199; opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .detail-panel-overlay.open { opacity: 1; pointer-events: auto; }

    /* Info Tooltip */
    .info-tip {
      position: relative; display: inline-block;
      margin-left: 5px; cursor: help;
      font-size: 11px; color: var(--globant-muted); opacity: 0.65;
      user-select: none; vertical-align: middle;
    }
    .info-tip .info-tip-text {
      visibility: hidden; opacity: 0;
      width: 220px; background: #1e2235; color: #c8cfe8;
      font-size: 11px; line-height: 1.5; font-weight: 400;
      text-transform: none; letter-spacing: 0;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 7px;
      padding: 8px 10px;
      position: absolute; z-index: 9999;
      bottom: 125%; left: 50%; transform: translateX(-50%);
      transition: opacity 0.15s ease;
      pointer-events: none; white-space: normal;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .info-tip:hover .info-tip-text { visibility: visible; opacity: 1; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 300;
    }
    .modal {
      background: var(--globant-dark); border: 1px solid var(--globant-border);
      border-radius: 16px; padding: 28px; max-width: 480px; width: 90%;
    }
    .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }

    /* Grid */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--globant-border); border-radius: 3px; }

    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; padding: 60px; }
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--globant-border);
      border-top-color: var(--globant-green); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(40px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Config screen */
    .config-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--globant-darker);
    }
    .config-box {
      background: var(--globant-dark); border: 1px solid var(--globant-border);
      border-radius: 16px; padding: 40px; max-width: 460px; width: 90%; text-align: center;
    }
    .config-box .logo-big {
      width: 56px; height: 56px; background: var(--globant-green);
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 24px; color: var(--globant-dark);
      margin: 0 auto 20px;
    }

    /* Tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--globant-border); }
    .tab-btn {
      padding: 10px 14px; border: none; background: transparent;
      color: var(--globant-muted); cursor: pointer; font-size: 12px;
      font-weight: 500; border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .tab-btn.active { color: var(--globant-green); border-bottom-color: var(--globant-green); }
    .tab-btn:hover { color: var(--globant-text); }

    /* Message box */
    .message-box {
      background: var(--globant-darker); border: 1px solid var(--globant-border);
      border-radius: 8px; padding: 12px; margin-bottom: 16px;
      font-size: 12px; line-height: 1.5; max-height: 200px; overflow-y: auto;
    }

    /* ── Mobile top bar (hidden on desktop) ── */
    .mobile-topbar {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; height: 56px;
      background: var(--globant-dark); border-bottom: 1px solid var(--globant-border);
      align-items: center; gap: 12px; padding: 0 16px; z-index: 200;
    }
    .mobile-topbar .hamburger {
      background: none; border: none; color: var(--globant-text);
      font-size: 22px; cursor: pointer; padding: 4px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 8px;
    }
    .mobile-topbar .hamburger:active { background: var(--globant-card); }
    .mobile-topbar .mob-title {
      flex: 1; font-weight: 700; font-size: 15px; color: var(--globant-text);
    }
    .mobile-topbar .mob-logo {
      width: 30px; height: 30px; background: linear-gradient(135deg,#5BBFB5,#3D9E94);
      border-radius: 7px; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; color: #1A1A2E; flex-shrink: 0;
    }

    /* Sidebar overlay (mobile) */
    .sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 250;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      /* Show mobile topbar */
      .mobile-topbar { display: flex; }

      /* Sidebar becomes a drawer */
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        z-index: 300; width: 260px;
        top: 0;
      }
      .sidebar.mob-open { transform: translateX(0); }
      .sidebar-overlay.mob-open { display: block; }

      /* Main content: full width, top padding for topbar */
      .main {
        margin-left: 0;
        padding: 72px 14px 24px;
      }

      /* Page header */
      .page-header h1 { font-size: 18px; }
      .page-header p { font-size: 12px; }

      /* KPI row: 2 cols on mobile */
      .kpi-row {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px; margin-bottom: 16px;
      }
      .kpi-card { padding: 14px; }
      .kpi-card .kpi-value { font-size: 22px; }

      /* Grids: stack on mobile */
      .grid-2, .grid-3 { grid-template-columns: 1fr; gap: 12px; }

      /* Cards: less padding */
      .card { padding: 14px; margin-bottom: 12px; }

      /* Tables: horizontal scroll */
      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .data-table th, .data-table td { padding: 10px 8px; font-size: 12px; }

      /* Detail panel: full screen */
      .detail-panel { width: 100%; }

      /* Modal: full screen bottom sheet on mobile */
      .modal-overlay { align-items: flex-end; padding: 0; }
      .modal {
        width: 100%; max-width: 100%; border-radius: 16px 16px 0 0;
        padding: 24px 20px; max-height: 90vh; overflow-y: auto;
      }

      /* Filters: horizontal scroll */
      .filters-row { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
      .filters-row::-webkit-scrollbar { display: none; }

      /* Action buttons: touch-friendly */
      .action-btn { padding: 8px 14px; font-size: 13px; }

      /* Inputs: larger touch targets */
      .input-field { padding: 12px 14px; font-size: 15px; }

      /* Hide sidebar footer user info label on mobile, keep compact */
      .sidebar-footer { padding: 12px 16px; }
    }
  </style>
</head>
<body>
  <!-- Loading screen — shown while app.js parses and React mounts -->
  <div id="oike-loading" style="position:fixed;inset:0;background:#12121F;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:Inter,sans-serif;">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:32px;">
      <div style="width:42px;height:42px;background:#5BBFB5;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#1A1A2E;">O</div>
      <div>
        <div style="font-weight:700;font-size:18px;color:#E8E8F0;">Oike</div>
        <div style="font-size:12px;color:#8888A8;">Sales Intelligence Platform</div>
      </div>
    </div>
    <div style="width:200px;height:3px;background:#1E1E32;border-radius:3px;overflow:hidden;">
      <div style="height:100%;background:#5BBFB5;border-radius:3px;animation:oike-bar 1.4s ease-in-out infinite;"></div>
    </div>
    <div style="font-size:12px;color:#8888A8;margin-top:16px;">Cargando aplicación...</div>
  </div>
  <style>
    @keyframes oike-bar {
      0%   { width:0%;   margin-left:0; }
      50%  { width:60%;  margin-left:20%; }
      100% { width:0%;   margin-left:100%; }
    }
  </style>

  <div id="root"></div>

  <script src="/app.js"></script>
</body>
</html>
