[build]
  command = "npm install && npm run build"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Landing page at root
[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200

# App at /app
[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200

# SPA fallback for app routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
