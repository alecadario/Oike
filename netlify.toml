[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# App at /app
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

# SPA fallback for app routes (keeps /app/* working)
[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

# Urban presentation
[[redirects]]
  from = "/urban"
  to = "/urban.html"
  status = 200

# Propuestas dinamicas
[[redirects]]
  from = "/p/*"
  to = "/p/:splat.html"
  status = 200

# Backward compat: link viejo /appex redirige a /p/appex
[[redirects]]
  from = "/appex"
  to = "/p/appex.html"
  status = 200
